name: 功能建议
description: 提议一个范围清晰的产品或工程改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 这个功能要解决什么用户或运维问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 描述最小可用结果，不要只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: impact
    attributes:
      label: 可能影响
      options:
        - label: 可能改变 HTTP API。
        - label: 可能改变数据库结构。
        - label: 可能影响认证或媒体鉴权。
        - label: 可能需要新的部署基础设施。
