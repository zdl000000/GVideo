name: Bug 报告
description: 报告可稳定复现的 GVideo 问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿在此提交凭证、私密媒体、数据库、访问令牌或安全漏洞。安全问题请使用私密漏洞报告。
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 实际发生了什么，预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行环境
      options:
        - Docker Compose
        - 本地开发
        - 公网测试隧道
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 提交前请删除本机路径和敏感数据。
      render: shell
