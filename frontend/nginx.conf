map $http_x_forwarded_proto $gvideo_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 524m;
    server_tokens off;

    # Security headers for the SPA and proxied responses. The CSP allows the
    # blob: media source and worker URLs hls.js needs for playback.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gvideo_forwarded_proto;
        proxy_set_header True-Client-IP "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /media/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gvideo_forwarded_proto;
        proxy_set_header True-Client-IP "";
    }

    location = /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $gvideo_forwarded_proto;
    }

    # Liveness must reach the backend; without this the SPA fallback would
    # answer 200 HTML and mask a dead backend for external probes.
    location = /livez {
        proxy_pass http://backend:8080/livez;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $gvideo_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://backend:8080/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $gvideo_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    # The theme bootstrap script changes rarely but must not lag behind a
    # release; revalidate with ETag instead of heuristic caching.
    location = /theme-init.js {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
