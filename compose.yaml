services:
  backend:
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-dockerproxy.net}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_PATH: /app/data/gvideo.db
      MEDIA_DIR: /app/media
      SESSION_TTL: 168h
      MAX_UPLOAD_BYTES: 536870912
      COOKIE_SECURE: "false"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      MEDIA_WORKER_ENABLED: "true"
      MEDIA_WORKER_POLL_INTERVAL: 2s
      MEDIA_PROBE_TIMEOUT: 30s
      HLS_ENABLED: "true"
      HLS_TRANSCODE_TIMEOUT: 30m
      HLS_SEGMENT_SECONDS: 4
    volumes:
      - gvideo-data:/app/data
      - gvideo-media:/app/media
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-dockerproxy.net}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  gvideo-data:
  gvideo-media:
