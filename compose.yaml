services:
  backend:
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-dockerproxy.net}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      METRICS_ADDR: ${METRICS_ADDR:-}
      PPROF_ADDR: ${PPROF_ADDR:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8088}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      DATABASE_PATH: /app/data/gvideo.db
      MEDIA_DIR: /app/media
      SESSION_TTL: 168h
      MAX_UPLOAD_BYTES: 536870912
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      MEDIA_WORKER_ENABLED: "true"
      MEDIA_WORKER_POLL_INTERVAL: 2s
      MEDIA_PROBE_TIMEOUT: 30s
      HLS_ENABLED: "true"
      HLS_TRANSCODE_TIMEOUT: 30m
      HLS_SEGMENT_SECONDS: 4
    volumes:
      - gvideo-data:/app/data
      - gvideo-media:/app/media
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-dockerproxy.net}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html && wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  gvideo-data:
    name: ${GVIDEO_DATA_VOLUME:-gvideo_gvideo-data}
  gvideo-media:
    name: ${GVIDEO_MEDIA_VOLUME:-gvideo_gvideo-media}
