services:
  backend:
    environment:
      APP_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL to the public HTTPS origin}
      COOKIE_SECURE: "true"

  gateway:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-dockerproxy.net}
    image: gvideo-gateway
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      GVIDEO_HOST: ${GVIDEO_HOST:?set GVIDEO_HOST to the public hostname}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${HTTPS_HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_FILE:?set TLS_CERT_FILE to the TLS certificate chain}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?set TLS_KEY_FILE to the TLS private key}:/etc/nginx/tls/privkey.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -fsS http://127.0.0.1/gateway-healthz >/dev/null && curl --max-time 2 -kfsS https://127.0.0.1/gateway-healthz >/dev/null && curl --max-time 3 -kfsS https://127.0.0.1/gateway-readyz >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s
